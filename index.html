<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automation Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #fff;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            color: #00d4ff;
        }

        .status-banner {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .status-online {
            background: rgba(63, 185, 80, 0.2);
            border: 1px solid #3fb950;
            color: #3fb950;
        }

        .status-offline {
            background: rgba(248, 81, 73, 0.2);
            border: 1px solid #f85149;
            color: #f85149;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: #1a1a2e;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #3fb950 0%, #2ea043 100%);
            color: #fff;
        }

        .btn-success:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(63, 185, 80, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4757 0%, #cc3344 100%);
            color: #fff;
        }

        .btn-danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 71, 87, 0.4);
        }

        .logs-container {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            overflow: hidden;
        }

        .logs-header {
            background: #161b22;
            padding: 15px 20px;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logs-header span {
            color: #8b949e;
            font-size: 0.9rem;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .status-dot.online {
            background: #3fb950;
            animation: pulse 2s infinite;
        }

        .status-dot.offline {
            background: #f85149;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .logs-content {
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #21262d;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-timestamp {
            color: #8b949e;
            margin-right: 10px;
        }

        .log-message {
            color: #c9d1d9;
        }

        .log-info { color: #58a6ff; }
        .log-success { color: #3fb950; }
        .log-warning { color: #d29922; }
        .log-error { color: #f85149; }

        .empty-state {
            text-align: center;
            color: #8b949e;
            padding: 60px 20px;
        }

        .log-count {
            background: #30363d;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #1a1a2e;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Automation Dashboard</h1>

        <div class="status-banner status-offline" id="pcStatus">
            PC: Hors ligne
        </div>

        <div class="controls">
            <button class="btn btn-success" id="runBtn">Lancer Automatisation</button>
            <button class="btn btn-danger" id="clearLogsBtn">Effacer les Logs</button>
        </div>

        <div class="logs-container">
            <div class="logs-header">
                <div class="status-indicator">
                    <div class="status-dot offline" id="statusDot"></div>
                    <span id="statusText">En attente de connexion...</span>
                </div>
                <span class="log-count" id="logCount">0 logs</span>
            </div>
            <div class="logs-content" id="logsContent">
                <div class="empty-state">
                    En attente de connexion au PC...
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, push, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Configuration Firebase
        const firebaseConfig = {
            databaseURL: "https://webpage-659e4-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // References
        const logsRef = ref(db, 'logs');
        const commandRef = ref(db, 'command');
        const statusRef = ref(db, 'pc_status');

        // DOM Elements
        const logsContent = document.getElementById('logsContent');
        const logCount = document.getElementById('logCount');
        const runBtn = document.getElementById('runBtn');
        const clearLogsBtn = document.getElementById('clearLogsBtn');
        const pcStatus = document.getElementById('pcStatus');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        let isRunning = false;
        let pcOnline = false;
        let wasOnline = false;
        let lastStatusTimestamp = 0;

        // Ecouter le statut du PC
        onValue(statusRef, (snapshot) => {
            const status = snapshot.val();
            if (status && status.online) {
                lastStatusTimestamp = status.timestamp;
                checkPCOnline();
            } else {
                pcOnline = false;
                updatePCStatus();
            }
        });

        // Verifier si le PC est en ligne (heartbeat < 15 sec)
        function checkPCOnline() {
            const now = Date.now();
            const newOnlineStatus = lastStatusTimestamp > 0 && (now - lastStatusTimestamp) < 15000;

            // Si le statut change, reset la commande bloquee
            if (newOnlineStatus !== wasOnline) {
                resetStuckCommand();
            }

            wasOnline = newOnlineStatus;
            pcOnline = newOnlineStatus;
            updatePCStatus();
        }

        // Reset une commande bloquee (running/pending)
        async function resetStuckCommand() {
            const snapshot = await new Promise(resolve => {
                onValue(commandRef, resolve, { onlyOnce: true });
            });
            const command = snapshot.val();
            if (command && (command.status === 'running' || command.status === 'pending')) {
                await set(commandRef, {
                    action: 'none',
                    status: 'reset',
                    timestamp: Date.now()
                });
            }
        }

        // Verifier regulierement si le PC est toujours en ligne (toutes les 2 sec)
        setInterval(() => {
            checkPCOnline();
        }, 2000);

        // Verifier immediatement au chargement
        checkPCOnline();

        function updatePCStatus() {
            if (pcOnline) {
                pcStatus.className = 'status-banner status-online';
                pcStatus.textContent = 'PC: En ligne';
                statusDot.className = 'status-dot online';
                statusText.textContent = 'Console Active';
                runBtn.disabled = false;
            } else {
                pcStatus.className = 'status-banner status-offline';
                pcStatus.textContent = 'PC: Hors ligne';
                statusDot.className = 'status-dot offline';
                statusText.textContent = 'En attente du PC...';
                runBtn.disabled = true;
            }
        }

        // Ecouter les logs en temps reel
        onValue(logsRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const logs = Object.values(data).sort((a, b) => a.order - b.order);
                renderLogs(logs);
            } else {
                renderLogs([]);
            }
        });

        // Ecouter l'etat de la commande
        onValue(commandRef, (snapshot) => {
            const command = snapshot.val();
            if (command && command.status === 'running') {
                isRunning = true;
                runBtn.disabled = true;
                runBtn.innerHTML = '<span class="spinner"></span>En cours...';
            } else {
                isRunning = false;
                runBtn.disabled = !pcOnline;
                runBtn.innerHTML = 'Lancer Automatisation';
            }
        });

        function renderLogs(logs) {
            if (logs.length === 0) {
                logsContent.innerHTML = `
                    <div class="empty-state">
                        Aucun log. Cliquez sur "Lancer Automatisation" pour commencer.
                    </div>
                `;
            } else {
                logsContent.innerHTML = logs.map(log => `
                    <div class="log-entry">
                        <span class="log-timestamp">[${log.timestamp}]</span>
                        <span class="log-message log-${log.type}">${log.message}</span>
                    </div>
                `).join('');
                scrollToBottom();
            }
            logCount.textContent = `${logs.length} log${logs.length > 1 ? 's' : ''}`;
        }

        function scrollToBottom() {
            logsContent.scrollTop = logsContent.scrollHeight;
        }

        // Lancer l'automatisation
        runBtn.addEventListener('click', async () => {
            if (isRunning || !pcOnline) return;

            await set(commandRef, {
                action: 'run',
                timestamp: Date.now(),
                status: 'pending'
            });
        });

        // Effacer les logs
        clearLogsBtn.addEventListener('click', async () => {
            await remove(logsRef);
        });
    </script>
</body>
</html>
